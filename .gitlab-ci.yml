# GitLab Pages — FRÖGY / toadboyz.com
# Static site: no build step. Publishes the repo into `public/`.
# Docs: https://docs.gitlab.com/ee/user/project/pages/

pages:
  stage: deploy
  image: alpine:latest
  script:
    # GitLab Pages serves whatever is in the `public/` directory.
    - mkdir -p public
    - cp -r index.html strains.html story.html stockists.html contact.html css js assets public/
  artifacts:
    paths:
      - public
  rules:
    # Only deploy from the default branch.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
